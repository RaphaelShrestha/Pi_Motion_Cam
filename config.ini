; pi-motion-cam - copy to ~/.config/pi-motion-cam/config.ini
; Command-line flags override anything set here.

[capture]
device     = /dev/video0
resolution = 640x480
fps        = 15

[detection]
threshold     = 25
sensitivity   = 1.5
min_frames    = 3
downscale     = 2
learning_rate = 0.05
; mask        = /home/pi/.config/pi-motion-cam/window-mask.pbm

[recording]
mode         = both
output       = ./captures
preroll      = 3
cooldown     = 5
max_duration = 120
